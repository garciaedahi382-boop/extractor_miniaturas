[package]
authors = ["LongYinan <lynweklm@gmail.com>"]
edition = "2021"
name = "extractor_miniaturas"
version = "0.1.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
ab_glyph = "0.2.32"
base64 = "0.23.1"
rayon = "1.12"
image = "0.25.10"
napi-derive = "3.6.5"
pdfium-render = { version = "0.9.5", features = ["image_025", "pdfium_7881", "thread_safe"], default-features = false }
quick-xml = "0.42.0"
zip = "9.3.0"

[dependencies.napi]
version = "3.12.4"
features = ["napi10"]

[build-dependencies]
napi-build = "2.4.2"

[profile.release]
lto = true
strip = "symbols"
